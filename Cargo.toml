[package]
name = "mdisplay"
version = "0.2.0"
edition = "2024"

[profile.dev.package."*"]
opt-level = 2

[dependencies]
clap = { version = "4.5.60", features = ["derive"] }
dirs = "6.0.0"
iced = { version = "0.14.0", default-features = false, features = ["advanced", "canvas", "tiny-skia", "wayland", "thread-pool", "crisp"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
wayland-backend = "0.3"
wayland-client = "0.31"
wayland-protocols-wlr = "0.3"
